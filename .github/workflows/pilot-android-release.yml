name: Build pilot Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-android-release
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build signed AAB from main
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pilot
    steps:
      - uses: actions/checkout@v4
        with:
          # Las compilaciones distribuibles se hacen únicamente desde main.
          ref: main

      - name: Restore Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode \
            > android/app/google-services.json

      - name: Restore Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve, analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed Android App Bundle
        env:
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
        run: flutter build appbundle --release

      - name: Publish App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-inteligentes-pilot-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
